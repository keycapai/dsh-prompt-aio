# dsh-skill-control bundle patch.
#
# A bundle ships this file; the loader applies it as a patch layer, so the row
# below is what installing the bundle actually mounts.
#
#   install -> plugin_manager install_bundle dsh-skill-control (asks first)
#   tune    -> edit the config below and restart
#   disable -> plugin_manager set_plugin skill-control-row false
#   remove  -> plugin_manager remove_bundle dsh-skill-control
#
# Never hand-copy this row into the profile's own cordis.patch.yml: the bundle
# row is already patched in by the loader, and a duplicate mount would leave a
# dangling module reference when the bundle is removed.
- insert:
    - id: skill-control-row
      name: "dsh-skill-control"
      config:
        enabled: true
        # Per-skill visibility overrides, keyed by exact skill name:
        #   full     — keep the full description in <available_skills>
        #   name     — keep only "- `name`"; read the description via
        #              skill_search { details: true }
        #   hidden   — remove the line from the catalog entirely; the skill
        #              remains fully loadable via the `skill` tool
        #   disabled — remove the line and drop skill-invocation injections
        skillModes: {}
        # Mode for skills without an explicit override. full keeps every
        # untouched installation unchanged.
        fallbackMode: full
        # Max characters of each catalog description; 0 = name only.
        catalogDescriptionMaxLength: 500
        # Append a prompt notice when the catalog is filtered, explaining how
        # to discover name-only and hidden skills.
        promptNotice: true
